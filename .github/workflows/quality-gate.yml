name: Quality Gate
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '0 6 * * 1' }]  # Weekly audit

jobs:
  # One authoritative verification interface (specs/004-agentic-development-
  # foundation, T104 · AC-008): this job runs the exact same `task verify`
  # entrypoint a developer runs locally (see scripts/verify.ps1,
  # scripts/verify.sh, Taskfile.yml). No command logic is duplicated here —
  # if a check needs to change, it's changed once in Taskfile.yml and both
  # CI and laptops pick it up. `task verify` = verify:fast (format, backend
  # build, frontend type/Svelte check, lint, backend unit tests, frontend
  # unit/component tests) + verify:contracts (retired-harness stale-reference
  # guard, OpenAPI/generated-client drift, EF migration drift, real-HTTP
  # integration tests) + verify:full's remaining stages (frontend production
  # build, vulnerable-package scan, auth-token/secret scan). No stage
  # requires Docker.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: corepack enable
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('src/TechInventory.Web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: arduino/setup-task@v2
        with: { version: '3.x' }
      # openapi drift comparison parses the freshly-exported document, which
      # OpenApiYamlWriter emits as real YAML — PyYAML is required to read it.
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      # `task restore` is the clean-checkout contract (docs/prd.md §7.5.5) and
      # also provisions the pinned gitleaks binary check:security resolves
      # from .tools/gitleaks (Taskfile.yml `tools:gitleaks`, T105 revision ·
      # B-4) — no separate install step duplicates that logic here; Task owns
      # it once, and `task verify` depends on `restore` transitively.
      - run: task restore
      - run: task verify

  codeql:
    runs-on: ubuntu-latest
    # SARIF upload requires Code Scanning to be enabled in repo settings
    # (Settings → Code security → Code scanning → Set up). On private repos
    # this is a paid GHAS feature; keep CodeQL as a CI artifact until then
    # so the analysis runs without red-marking PRs on upload failure.
    permissions:
      contents: read           # actions/checkout needs this when permissions are scoped
      actions: read            # required by CodeQL on private repositories
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read         # actions/checkout
      pull-requests: read    # gitleaks-action reads PR commits on pull_request events
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-config-scan:
    # Trivy CONFIG scan only — catches Dockerfile + Compose + IaC
    # misconfigurations on PR. The previous `scan-type: fs` was largely
    # redundant once we scan published images (see security-scan.yml,
    # which Trivy-scans the actual GHCR images on every release). Keeping
    # config-only here means Dockerfile regressions (e.g. running as root,
    # missing healthcheck, exposed secrets via ENV) still block at PR time.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'

  sbom:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0
        with: { format: cyclonedx-json }
