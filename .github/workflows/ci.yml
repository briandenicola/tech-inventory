name: CI Pipeline

# Disabled — left on workflow_dispatch only so it doesn't auto-fire on
# every push/PR. Quality Gate (`.github/workflows/quality-gate.yml`) carries
# the merge-blocking checks on every push/PR and now calls the identical
# `task verify` entrypoint this workflow calls via `scripts/verify.sh`
# (specs/004-agentic-development-foundation, T104 · AC-008) — so this
# workflow is a manual-only alternate entrypoint into the same pipeline,
# not a competing one. (Historical note: it was originally muted because
# verify.sh's E2E step required a browser-automation harness + Docker; that
# step was retired in T101 — see brief.md §2.1 — and verify.sh itself was
# rewritten in T104 to be a thin wrapper around `task verify`. Whether to
# re-enable this workflow on push/PR, or retire it in favor of Quality Gate
# alone, is a decision for a future task — T104 only made the pipeline it
# calls correct and non-duplicative.)
on:
  workflow_dispatch:

jobs:
  verify:
    name: Build, Test, and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'

      - name: Restore dependencies (incl. pinned gitleaks)
        # `task restore` is the clean-checkout contract (docs/prd.md §7.5.5)
        # and provisions the pinned gitleaks binary check-security.mjs
        # resolves from .tools/gitleaks (Taskfile.yml `tools:gitleaks`, T105
        # revision · B-4). Runs before the direct check-security.mjs call
        # below (which pre-dates `task verify`) and before `task verify`
        # itself so neither path duplicates install logic Task now owns.
        run: task restore

      - name: Run auth token and secret scan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
            node ./scripts/check-security.mjs --diff-range "FETCH_HEAD...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            node ./scripts/check-security.mjs --diff-range "${{ github.sha }}^!"
          else
            node ./scripts/check-security.mjs --diff-range "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('src/TechInventory.Web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # check:openapi-drift's comparison parses the freshly-exported document,
      # which OpenApiYamlWriter emits as real YAML — PyYAML is required to
      # read it. This step must stay identical to quality-gate.yml's (T104
      # revision · B-3): both workflows call the same `task verify` entrypoint
      # via `scripts/verify.sh`, and it needs this dependency in either place.
      - name: Install PyYAML for OpenAPI drift comparison
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Run verification pipeline
        # scripts/verify.sh is a thin wrapper that calls `task verify` — the
        # same authoritative entrypoint Quality Gate and developer laptops
        # use. No pipeline logic lives in this workflow or in verify.sh.
        run: ./scripts/verify.sh

      # Container build + push lives in `.github/workflows/release-images.yml`
      # (triggers on push-to-main, v* tags, and workflow_dispatch).
      # SBOM generation + Trivy scanning are owned by Bishop in a follow-up
      # workflow that `needs: [build-api, build-web]` from release-images.yml
      # and consumes their `outputs.image-digest`.
