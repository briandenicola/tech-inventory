version: '3'

# Tech Inventory — Local Development Automation
# Requires: Docker (only for `task up`/`down`/`logs`/`ps`/`backup:*`), Task (https://taskfile.dev)
#   Install Task via: `choco install go-task` (Windows) or `brew install go-task/tap/go-task` (macOS/Linux)
#
# Task is the one authoritative verification interface — humans and CI both
# run `task verify` (or its `verify:fast`/`verify:contracts` stages). Nothing
# in `verify`, `verify:fast`, or `verify:contracts` requires Docker; every
# check runs against an in-process ASP.NET Core TestServer + real SQLite file,
# not a container (specs/004-agentic-development-foundation, T104 · AC-008).
#
# `task restore` is the clean-checkout contract (docs/prd.md §7.5.5): it also
# provisions the pinned `gitleaks` binary `check:security` needs (via
# `tools:gitleaks`, idempotent — skips the download once the pinned version is
# already present), so `restore` → `verify` works with no manual setup step and
# no undeclared network fallback inside `verify` itself (specs/004-agentic-
# development-foundation, T105 revision · B-4).
#
# Core commands:
#   task up              — Bring up the full dev stack (API, Web, DB) via Docker Compose
#   task dev:up          — Local (non-Docker) one-command dev: migrate + run API + Web in parallel
#   task test            — Run unit + integration + frontend tests (no Docker; enforces collected-test floors)
#   task down             — Tear down the stack
#   task verify           — THE authoritative verification pipeline (alias for verify:full). No Docker required.
#   task verify:fast      — format · backend build · frontend type-check · lint · unit · frontend unit/component tests
#   task verify:contracts — retired-harness stale-reference guard · OpenAPI/client drift · EF migration drift · real-HTTP integration tests
#   task verify:full      — verify:fast + verify:contracts + frontend production build + vulnerability scan + auth-token/secret scan
#
# Local validation:
#   task validate:local  — Fresh checkout → working dev environment with DB migrations applied
#   task dev:api         — Run API only (foreground, http://localhost:8080)
#   task dev:web         — Run Web dev server only (foreground, http://localhost:5173)
#   task import:preview  — Preview CSV import (default: data/Devices.csv)
#   task import:commit   — Commit CSV import to database (destructive)
#
# Production / backups:
#   task backup:verify   — Spot-check the latest Litestream snapshot (requires --profile backup running)
#   task backup:restore  — Restore /data/techinv.db from the latest replica (DESTRUCTIVE)

silent: false
method: timestamp

tasks:
  tools:gitleaks:
    desc: 'Provision the pinned gitleaks binary into .tools/gitleaks if it is not already present at the pinned version (idempotent — status check below skips the download once the pinned version is present, so restore''s many dependents do not re-download on every call). Single install path for gitleaks; restore (clean checkout) and hooks:install (pre-commit hook) both depend on this instead of each running their own copy of the download logic (specs/004-agentic-development-foundation, T105 revision, B-4)'
    vars:
      GITLEAKS_VERSION: '8.30.1'
    status:
      - node scripts/check-gitleaks-installed.mjs {{.GITLEAKS_VERSION}}
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '.\scripts\install-gitleaks.ps1' -Version '{{.GITLEAKS_VERSION}}'"
        platforms: [windows]
      - cmd: bash ./scripts/install-gitleaks.sh {{.GITLEAKS_VERSION}}
        platforms: [linux, darwin]

  restore:
    desc: Restore .NET dependencies, pinned CLI tools (dotnet-ef), pnpm dependencies, and the pinned gitleaks binary check:security needs (specs/004-agentic-development-foundation, T105 revision · B-4)
    deps: [tools:gitleaks]
    cmds:
      - dotnet tool restore
      - dotnet restore
      - pnpm --dir src/TechInventory.Web install --frozen-lockfile
      # Runs on every restore (not gated by tools:gitleaks' own status skip)
      # so a regression in the provisioning checker cannot rot unnoticed —
      # same pattern as check:client-drift/check:vulnerable's own suites
      # (T105 revision · B-4).
      - node --test scripts/check-gitleaks-installed.test.mjs

  build:backend:
    desc: Build the backend (.NET) in Release configuration
    deps: [restore]
    cmds:
      - dotnet build -c Release --no-restore

  build:frontend:
    desc: Build the frontend production bundle (SvelteKit static adapter)
    deps: [restore]
    cmds:
      - pnpm --dir src/TechInventory.Web run build

  build:
    desc: Build backend and frontend
    deps: [build:backend, build:frontend]

  check:format:
    desc: Verify .NET code formatting with no changes required (dotnet format --verify-no-changes)
    cmds:
      - dotnet format --verify-no-changes

  check:frontend:
    desc: Type-check and Svelte-check the frontend without mutating generated artifacts
    deps: [restore]
    cmds:
      - pnpm --dir src/TechInventory.Web run check

  check:client-drift:
    desc: Fail if the generated OpenAPI client (types.ts) has drifted from the working-tree openapi.yaml (snapshots the artifact, regenerates, compares, restores on both success and failure — never depends on committing); also runs this checker's own unit suite so a regression in the guard itself cannot rot unnoticed (T105 · F-10)
    deps: [restore]
    cmds:
      - node scripts/check-client-drift.mjs
      - node --test scripts/check-client-drift.test.mjs

  check:openapi-drift:
    desc: Fail if the committed OpenAPI document has drifted from the API project (regenerates via export-openapi and diffs structurally, ignoring JSON/YAML serializer noise)
    deps: [restore]
    vars:
      GENERATED: '{{.ROOT_DIR}}/TestResults/openapi-drift/openapi.generated.yaml'
    cmds:
      - mkdir -p TestResults/openapi-drift
      # `dotnet run --project` sets the child process's working directory to
      # the *project* folder, not this shell's — the output path must be
      # absolute or it lands under src/TechInventory.Api/ instead of the repo root.
      - dotnet run --project src/TechInventory.Api/TechInventory.Api.csproj -c Release --no-launch-profile -- export-openapi "{{.GENERATED}}"
      - cmd: python scripts/compare-openapi.py openapi.yaml "{{.GENERATED}}"
        platforms: [windows]
      - cmd: python3 scripts/compare-openapi.py openapi.yaml "{{.GENERATED}}"
        platforms: [linux, darwin]

  check:migration-drift:
    desc: Fail if the EF Core model has pending changes not captured by a migration (dotnet ef migrations has-pending-model-changes)
    deps: [restore]
    cmds:
      - dotnet ef migrations has-pending-model-changes --project src/TechInventory.Infrastructure/TechInventory.Infrastructure.csproj --startup-project src/TechInventory.Api/TechInventory.Api.csproj

  check:vulnerable:
    desc: Fail if any direct or transitive .NET package reports a Moderate+ vulnerability (constitution.md §5.8) — parses `dotnet list package --vulnerable --format json`, not just its exit code (the raw command exits 0 even when it reports advisories); also runs this checker's own unit suite so a regression in the guard itself cannot rot unnoticed (T105 · F-10)
    deps: [restore]
    cmds:
      - node scripts/check-vulnerable.mjs
      - node --test scripts/check-vulnerable.test.mjs

  check:security:
    desc: Fail if any tracked file contains an auth-token-persistence pattern (localStorage token/JWT/MSAL storage) or a gitleaks-detected secret — repo-wide scan of every tracked file, no diff range required (specs/004-agentic-development-foundation, T105 · F-5 — brings the existing check-security.mjs auth-token/secret scan under the one authoritative Task graph instead of leaving it reachable only from a workflow_dispatch-only workflow and a bypassable pre-commit hook). Consumes the gitleaks binary `restore` provisions; does not install it itself and fails clearly (not a silent network fallback) if it is missing (T105 revision · B-4).
    deps: [restore]
    cmds:
      - node scripts/check-security.mjs --repo

  lint:
    desc: Lint backend and frontend
    deps: [check:format]
    cmds:
      - pnpm --dir src/TechInventory.Web run lint

  hooks:install:
    desc: Install repo-managed git hooks and the pinned gitleaks binary (gitleaks install logic lives only in tools:gitleaks; restore uses the same task, T105 revision · B-4)
    deps: [tools:gitleaks]
    cmds:
      - git config core.hooksPath .githooks
      - cmd: chmod +x .githooks/pre-commit
        platforms: [linux, darwin]

  up:
    desc: Start the full dev stack (API + Web + DB)
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop and remove all containers, networks, and volumes
    cmds:
      - docker compose down -v

  test:unit:
    desc: Run backend unit tests (real xUnit, no Docker; enforces the collected-test floor — scripts/check-test-floors.mjs)
    deps: [restore]
    cmds:
      - node scripts/check-test-floors.mjs unit

  test:integration:
    desc: Run backend integration tests — real HTTP via in-process WebApplicationFactory + real SQLite files, no Docker; enforces the collected-test floor
    deps: [restore]
    cmds:
      - node scripts/check-test-floors.mjs integration

  test:frontend:
    desc: Run frontend unit/component tests (Vitest + Testing Library + axe-core, no Docker; enforces the collected-test floor)
    deps: [restore]
    cmds:
      - node scripts/check-test-floors.mjs frontend

  test:
    desc: Run all mandatory tests — backend unit, backend integration, frontend unit/component. No Docker or running stack required.
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:frontend

  check:stale-refs:
    desc: Fail if the retired browser-E2E harness has returned to active manifests, scripts, workflows, config, docs, or test trees
    cmds:
      - node ./scripts/check-stale-playwright-references.mjs
      - node --test ./scripts/check-stale-playwright-references.test.mjs

  verify:fast:
    desc: "Fast local loop, no Docker: format · backend build · frontend type-check · lint · backend unit tests · frontend unit/component tests"
    deps: [restore]
    cmds:
      - task: check:format
      - task: build:backend
      - task: check:frontend
      - task: lint
      - task: test:unit
      - task: test:frontend

  verify:contracts:
    desc: "Contract verification, no Docker: retired-harness stale-reference guard · OpenAPI/client drift · EF migration drift · real-HTTP integration tests"
    deps: [restore]
    cmds:
      - task: check:stale-refs
      - task: check:openapi-drift
      - task: check:client-drift
      - task: check:migration-drift
      - task: test:integration

  verify:full:
    desc: "Full verification, no Docker: verify:fast + verify:contracts + frontend production build + vulnerability scan + auth-token/secret scan"
    cmds:
      - task: verify:fast
      - task: verify:contracts
      - task: build:frontend
      - task: check:vulnerable
      - task: check:security

  verify:
    desc: THE authoritative verification pipeline — alias for verify:full. Same entrypoint humans and CI both run. No Docker required.
    cmds:
      - task: verify:full

  openapi:export:
    desc: Regenerate the committed OpenAPI YAML from the API project
    cmds:
      - dotnet run --project src/TechInventory.Api/TechInventory.Api.csproj -- export-openapi

  logs:
    desc: Tail logs from all running containers
    cmds:
      - docker compose logs -f

  ps:
    desc: Show running containers
    cmds:
      - docker compose ps

  backup:verify:
    desc: Spot-check the most recent Litestream snapshot (prod stack only)
    summary: |
      Lists Litestream snapshots for /data/techinv.db and prints the age of
      the newest one. Requires the prod stack with `--profile backup` running.
    cmds:
      - cmd: |
          $compose = 'docker compose -f docker-compose.yml -f docker-compose.prod.yml'
          $running = & docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup ps backup --status running --quiet
          if (-not $running) {
            Write-Error 'litestream sidecar is not running. Start it with: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup up -d backup'
            exit 1
          }
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec backup litestream snapshots -config /etc/litestream.yml /data/techinv.db
        platforms: [windows]
      - cmd: |
          set -e
          if ! docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup ps backup --status running --quiet | grep -q .; then
            echo "litestream sidecar is not running."
            echo "   Start it with: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup up -d backup"
            exit 1
          fi
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec backup \
            litestream snapshots -config /etc/litestream.yml /data/techinv.db
        platforms: [linux, darwin]

  backup:restore:
    desc: Restore /data/techinv.db from the latest Litestream replica (DESTRUCTIVE)
    summary: |
      Stops the API, restores the latest snapshot into a temp file, swaps it
      into place, and restarts the API. Make a host-side copy of techinv.db
      first if you might want to roll back this restore.
    cmds:
      - cmd: |
          set -e
          echo "⚠️  This will overwrite /data/techinv.db inside the techinv-data volume."
          read -p "Type 'restore' to continue: " confirm
          [ "$confirm" = "restore" ] || { echo "Aborted."; exit 1; }
          docker compose -f docker-compose.yml -f docker-compose.prod.yml stop api
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup run --rm backup \
            litestream restore -config /etc/litestream.yml -o /data/techinv.db.restored /data/techinv.db
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup run --rm --entrypoint sh backup \
            -c 'mv /data/techinv.db /data/techinv.db.pre-restore && mv /data/techinv.db.restored /data/techinv.db'
          docker compose -f docker-compose.yml -f docker-compose.prod.yml start api
          echo "✅ Restore complete. Previous DB saved as /data/techinv.db.pre-restore in the volume."
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -Command "Write-Warning 'backup:restore is documented only on Linux/macOS. On Windows, follow docs/deployment.md → Backup & restore manually.'"
        platforms: [windows]

  clean:
    desc: Remove build artifacts and volumes
    cmds:
      - dotnet clean
      - cmd: powershell -NoProfile -Command "Remove-Item -Path 'src/TechInventory.Web/build', 'src/TechInventory.Web/.svelte-kit' -Recurse -Force -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf src/TechInventory.Web/build src/TechInventory.Web/.svelte-kit
        platforms: [linux, darwin]
      - docker compose down -v

  db:migrate:
    desc: Apply EF Core migrations to the local database
    cmds:
      - dotnet ef database update --project src/TechInventory.Infrastructure/TechInventory.Infrastructure.csproj --startup-project src/TechInventory.Api/TechInventory.Api.csproj

  dev:api:
    desc: Run the API in Development mode (foreground, http://localhost:8080)
    env:
      ASPNETCORE_ENVIRONMENT: Development
    cmds:
      - dotnet run --project src/TechInventory.Api/TechInventory.Api.csproj

  dev:web:
    desc: Run the Web dev server (foreground, http://localhost:5173)
    cmds:
      - pnpm --dir src/TechInventory.Web run dev

  dev:up:
    desc: One-command dev — migrate + run API + Web in parallel (Ctrl+C exits both)
    deps: [db:migrate]
    env:
      ASPNETCORE_ENVIRONMENT: Development
    cmds:
      - npx concurrently --kill-others --names "API,WEB" --prefix-colors "blue,green" "dotnet run --project src/TechInventory.Api/TechInventory.Api.csproj" "pnpm --dir src/TechInventory.Web run dev"

  dev:
    desc: Run API and Web dev servers (see task validate:local for full flow)
    cmds:
      - cmd: |
          Write-Host "⚠️  Run these commands in separate terminals:" -ForegroundColor Yellow
          Write-Host "   Terminal 1: task dev:api" -ForegroundColor Cyan
          Write-Host "   Terminal 2: task dev:web" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "API will be at http://localhost:8080 (auth bypass enabled)" -ForegroundColor Green
          Write-Host "Web will be at http://localhost:5173" -ForegroundColor Green
        platforms: [windows]
      - cmd: |
          echo "⚠️  Run these commands in separate terminals:"
          echo "   Terminal 1: task dev:api"
          echo "   Terminal 2: task dev:web"
          echo ""
          echo "API will be at http://localhost:8080 (auth bypass enabled)"
          echo "Web will be at http://localhost:5173"
        platforms: [linux, darwin]

  import:preview:
    desc: Preview a CSV import (multipart/form-data POST to /api/v1/imports/preview)
    vars:
      CSV: '{{default "data/Devices.csv" .CSV}}'
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/import-preview.ps1 -CsvPath "{{.CSV}}"
        platforms: [windows]
      - cmd: bash scripts/import-preview.sh "{{.CSV}}"
        platforms: [linux, darwin]

  import:commit:
    desc: Commit a CSV import to the database (DESTRUCTIVE - will write to DB)
    vars:
      CSV: '{{default "data/Devices.csv" .CSV}}'
      CONFIRM: '{{default "no" .CONFIRM}}'
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/import-commit.ps1 -CsvPath "{{.CSV}}" -Confirm "{{.CONFIRM}}"
        platforms: [windows]
      - cmd: bash scripts/import-commit.sh "{{.CSV}}" "{{.CONFIRM}}"
        platforms: [linux, darwin]

  validate:local:
    desc: Full local validation flow (restore → migrate → ready to run dev:up)
    cmds:
      - task: restore
      - task: db:migrate
      - cmd: |
          Write-Host ""
          Write-Host "✅ Dependencies restored and database migrated." -ForegroundColor Green
          Write-Host ""
          Write-Host "🚀 Next step: Run the dev stack with one command:" -ForegroundColor Cyan
          Write-Host "   task dev:up" -ForegroundColor Green
          Write-Host ""
          Write-Host "   This will start API (http://localhost:8080) and Web (http://localhost:5173) in parallel." -ForegroundColor White
          Write-Host "   Press Ctrl+C to stop both servers." -ForegroundColor White
          Write-Host ""
          Write-Host "Once running:" -ForegroundColor Cyan
          Write-Host "   • API health: http://localhost:8080/health/ready"
          Write-Host "   • Web UI: http://localhost:5173"
          Write-Host "   • Preview CSV: task import:preview"
          Write-Host "   • Commit to DB: task import:commit CONFIRM=yes"
          Write-Host ""
          Write-Host "💡 Auth bypass is enabled in Development mode (no token required)." -ForegroundColor Yellow
        platforms: [windows]
      - cmd: |
          echo ""
          echo "✅ Dependencies restored and database migrated."
          echo ""
          echo "🚀 Next step: Run the dev stack with one command:"
          echo "   task dev:up"
          echo ""
          echo "   This will start API (http://localhost:8080) and Web (http://localhost:5173) in parallel."
          echo "   Press Ctrl+C to stop both servers."
          echo ""
          echo "Once running:"
          echo "   • API health: http://localhost:8080/health/ready"
          echo "   • Web UI: http://localhost:5173"
          echo "   • Preview CSV: task import:preview"
          echo "   • Commit to DB: task import:commit CONFIRM=yes"
          echo ""
          echo "💡 Auth bypass is enabled in Development mode (no token required)."
        platforms: [linux, darwin]
